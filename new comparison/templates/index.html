<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART SHOPPING ASSISTANT: PRICE COMPARISON</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Style */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Container Style */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Header Style */
        header {
            background-color: #0066cc;
            color: white;
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        header h1 {
            font-size: 36px;
            font-weight: 600;
        }

        header p {
            font-size: 20px;
            font-weight: 400;
            margin-top: 10px;
        }

        /* Search Form Styles */
        .search-form {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-form input {
            padding: 12px;
            width: 60%;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-right: 10px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-form input:focus {
            border-color: #0066cc;
        }

        .search-form button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .search-form button:hover {
            background-color: #005bb5;
        }

        /* Error Message Style */
        .error {
            color: #e74c3c;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        /* Footer Styles */
        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #777;
        }

        footer a {
            text-decoration: none;
            color: #0066cc;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SMART SHOPPING ASSISTANT: PRICE COMPARISON</h1>
            <p>Find the best deals across Amazon and Flipkart</p>
        </header>

        <!-- Search Form -->
        <form action="/search" method="POST" class="search-form">
            <input type="text" name="search_term" placeholder="Search for products..." required>
            <button type="submit">Search</button>
        </form>

        <!-- Error Message if any -->
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Smart Shopping Assistant. <a href="https://www.example.com">Terms & Conditions</a></p>
    </footer>
</body>
</html>
